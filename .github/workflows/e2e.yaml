#
# End-to-end suite: `make test-e2e` creates the kind cluster from
# hack/kind-config.yaml, installs the CRDs, deploys the controller and runs the
# e2e tests against it. kind is pinned by version and by checksum here; the node
# image and every other pin live in the Makefile.
name: E2E

on:
  pull_request:
    # Docs and chart-only edits cannot change what the end-to-end suite proves:
    # it exercises the controller image built from this tree against a real
    # coturn. Skipping it there saves ~10 minutes on every documentation pull
    # request. `make helm-lint` and `make helm-drift` (the ci job) already hold
    # the chart to config/, and the chart install path is exercised by the step
    # below whenever anything else changes.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/pull_request_template.md'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Renovate reads this line (customManager in renovate.json) and keeps it in
  # step with the `go` directive in go.mod.
  GO_VERSION: "1.27.2"
  KIND_VERSION: v0.33.0
  # sha256 of kind-linux-amd64 from the kind v0.33.0 release assets.
  KIND_LINUX_AMD64_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # The suite's 60 minutes plus the chart install's 30: this job installs the
    # controller twice, once from kustomize and once from the chart.
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # kubectl is not installed here: ubuntu-latest already ships the kubectl
      # the Makefile uses, and adding an action for it would mean another pin.
      - name: Install kind
        run: |
          set -euo pipefail
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_LINUX_AMD64_SHA256}  kind" | sha256sum --check --strict -
          chmod +x kind
          sudo install -m 0755 kind /usr/local/bin/kind
          rm -f kind
          kind version

      - name: Run the end-to-end suite
        timeout-minutes: 60
        run: make test-e2e

      # The chart is an installer for the same controller the suite just ran:
      # this removes what kustomize deployed, installs the CRDs and the
      # controller from charts/turnfleet, and probes a relay from a pool created
      # against that install. `make helm-drift` already proved the chart renders
      # what config/ renders; this proves the install works on a real cluster.
      - name: Install the controller from the chart and probe a relay
        timeout-minutes: 30
        # REUSE_IMAGES=1: the step above built these images from the same tree
        # and loaded them into this cluster. Rebuilding them cost 137s of this
        # step (measured in run 38719831132) for two images whose content is
        # identical, and reloading them cost another 7s.
        run: make test-e2e-chart REUSE_IMAGES=1
