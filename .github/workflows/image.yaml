#
# Container images. Both images are multi-arch (linux/amd64, linux/arm64) and
# are pushed to ghcr.io with provenance and an SBOM attached. The builder and
# runtime images are pinned by tag and digest in the Makefile (GO_IMAGE,
# RUNTIME_IMAGE) and are passed in as build arguments, so the build inputs are
# the same as `make docker-buildx`.
#
# A push to main builds the `main` tag for day-to-day work; a published release
# builds the release's tag, and that is the only path that publishes a version.
name: Image

on:
  push:
    branches:
      - main
  # A release is what publishes the images for a tag: creating the GitHub release
  # runs this workflow for its tag, so one act starts the pipeline and the tag
  # alone publishes nothing.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required to push to ghcr.io with the workflow's own GITHUB_TOKEN.
  packages: write

env:
  # Container image pins; the digests are copied verbatim from the Makefile
  # (GO_IMAGE and RUNTIME_IMAGE), which is what `make docker-buildx` uses.
  GO_IMAGE: golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61
  RUNTIME_IMAGE: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  images:
    name: Build and push the images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 is emulated on the amd64 runners; the builder stage itself runs on
      # BUILDPLATFORM and cross-compiles with CGO_ENABLED=0.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags for turnfleet-controller
        id: meta-controller
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/hazmi35/turnfleet-controller

      - name: Derive tags for turnfleet-probe
        id: meta-probe
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/hazmi35/turnfleet-probe

      - name: Build and push turnfleet-controller
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-controller.outputs.tags }}
          labels: ${{ steps.meta-controller.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            GO_IMAGE=${{ env.GO_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            LDFLAGS=-s -w -X github.com/Hazmi35/turnfleet/internal/version.version=${{ steps.meta-controller.outputs.version }} -X github.com/Hazmi35/turnfleet/internal/version.commit=${{ github.sha }}

      - name: Build and push turnfleet-probe
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.probe
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-probe.outputs.tags }}
          labels: ${{ steps.meta-probe.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            GO_IMAGE=${{ env.GO_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            LDFLAGS=-s -w -X github.com/Hazmi35/turnfleet/internal/version.version=${{ steps.meta-probe.outputs.version }} -X github.com/Hazmi35/turnfleet/internal/version.commit=${{ github.sha }}
