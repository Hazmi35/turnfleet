#
# Container images. Both images are multi-arch (linux/amd64, linux/arm64) and
# are pushed to ghcr.io with provenance and an SBOM attached. The builder and
# runtime images are pinned by tag and digest in the Makefile (GO_IMAGE,
# RUNTIME_IMAGE) and are passed in as build arguments, so the build inputs are
# the same as `make docker-buildx`.
#
# A push to main builds the `main` tag for day-to-day work; a published release
# builds the release's tag, and that is the only path that publishes a version.
# A release publishes two tags: the git tag (`vX.Y.Z`) and its bare semver
# (`X.Y.Z`), because the chart's default image tag is its `appVersion`, the bare
# number (ADR 17, docs/versions.md). The version embedded in the binary stays the
# git ref, so a released image reports `vX.Y.Z` exactly as `make build` does.
#
# Those two tags have one writer: the release event. A branch push and a manual
# run publish the commit-addressed `sha-<sha>` instead (and, for a branch, the
# branch's own tag), because `release.yaml` resolves `vX.Y.Z` while this workflow
# may still be publishing it, and a release tag another run can move after that
# resolution is a release that documents a digest the tag no longer carries.
# `sha-<sha>` names a commit, not a particular build of it: a commit can be built
# more than once, so it is a handle to look a commit up by, not a reproducible
# digest, and nothing resolves a release through it.
#
# The `-X` stamps are the Makefile's LDFLAGS, including `date` in the Makefile's
# `date -u +%Y-%m-%dT%H:%M:%SZ` form, so a released binary reports its build
# date rather than the `unknown` the linker leaves when the stamp is missing.
name: Image

on:
  push:
    branches:
      - main
  # A release is what publishes the images for a tag: creating the GitHub release
  # runs this workflow for its tag, so one act starts the pipeline and the tag
  # alone publishes nothing.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required to push to ghcr.io with the workflow's own GITHUB_TOKEN.
  packages: write

env:
  # Container image pins; the digests are copied verbatim from the Makefile
  # (GO_IMAGE and RUNTIME_IMAGE), which is what `make docker-buildx` uses.
  GO_IMAGE: golang:1.27.3-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5
  RUNTIME_IMAGE: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
  PLATFORMS: linux/amd64,linux/arm64
  # The Makefile's LDFLAGS without the date: `-s -w`, the version (the ref being
  # built) and the commit. It lives here so both builds stamp the same two, and
  # the date is appended per build because it is a step's output and a
  # workflow-level env is resolved before any step runs.
  LDFLAGS_BASE: -s -w -X github.com/Hazmi35/turnfleet/internal/version.version=${{ github.ref_name }} -X github.com/Hazmi35/turnfleet/internal/version.commit=${{ github.sha }}

jobs:
  images:
    name: Build and push the images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The date `make build` stamps, in the Makefile's format. It cannot live in
      # the workflow's `env` beside the rest of the LDFLAGS: an `env` is resolved
      # before any step runs, and this value is an output of a step. `date` is
      # not the `created` label the images carry (metadata-action's, the moment
      # the tags were derived) but the moment the binaries were stamped, which is
      # what `internal/version.Date` reports and what a released binary was
      # missing.
      - name: Stamp the build date
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      # arm64 is emulated on the amd64 runners; the builder stage itself runs on
      # BUILDPLATFORM and cross-compiles with CGO_ENABLED=0.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags for turnfleet-controller
        id: meta-controller
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/hazmi35/turnfleet-controller
          # The default rules are branch and tag refs; the semver rule is the one
          # the chart's default image tag needs. The two that name a release's
          # version are gated on the release event: it is the only event that
          # publishes a version, so a manual run on a tag ref cannot move a tag
          # `release.yaml` is reading. Every build is also addressable by the
          # commit it was built from.
          tags: |
            type=ref,event=branch
            type=ref,event=tag,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=sha,format=long
          # The action detects the license from LICENSE with GitHub's own
          # heuristic, which answers the deprecated `AGPL-3.0` rather than the
          # `AGPL-3.0-only` this repository is under, and a label set here
          # overrides the one it generated. The value has to be the identifier
          # the Dockerfile labels, `make licenses` enforces and the SPDX
          # documents name.
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Derive tags for turnfleet-probe
        id: meta-probe
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/hazmi35/turnfleet-probe
          tags: |
            type=ref,event=branch
            type=ref,event=tag,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=sha,format=long
          # As in the controller's step: the action's license detection answers
          # the deprecated `AGPL-3.0`, and the label set here replaces it.
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and push turnfleet-controller
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-controller.outputs.tags }}
          labels: ${{ steps.meta-controller.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            GO_IMAGE=${{ env.GO_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            LDFLAGS=${{ env.LDFLAGS_BASE }} -X github.com/Hazmi35/turnfleet/internal/version.date=${{ steps.stamp.outputs.date }}

      - name: Build and push turnfleet-probe
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.probe
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-probe.outputs.tags }}
          labels: ${{ steps.meta-probe.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            GO_IMAGE=${{ env.GO_IMAGE }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            LDFLAGS=${{ env.LDFLAGS_BASE }} -X github.com/Hazmi35/turnfleet/internal/version.date=${{ steps.stamp.outputs.date }}

      # The labels are read back from the pushed digest, not from the action's
      # output, so this checks the image a consumer pulls. The licence and the
      # source are the two the release checklist requires of a published image,
      # and the licence is the one piece of metadata that went wrong unnoticed:
      # the metadata action answered the deprecated `AGPL-3.0` from LICENSE and
      # overrode the Dockerfile's `AGPL-3.0-only` with it.
      - name: Check the published labels
        run: |
          set -euo pipefail
          base="ghcr.io/hazmi35"
          for name in turnfleet-controller turnfleet-probe; do
            ref="${base}/${name}:sha-${GITHUB_SHA}"
            labels="$(docker buildx imagetools inspect "${ref}" --format '{{json .Image}}' \
              | jq -r '[.. | .config? // empty | .Labels? // empty] | first // {}')"
            for pair in \
              "org.opencontainers.image.licenses=AGPL-3.0-only" \
              "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"; do
              key="${pair%%=*}"
              want="${pair#*=}"
              got="$(jq -r --arg key "${key}" '.[$key] // ""' <<<"${labels}")"
              if [ "${got}" != "${want}" ]; then
                echo "::error::${ref} carries ${key}=${got:-nothing}, not ${want}" >&2
                exit 1
              fi
            done
            echo "${ref}: licence and source labels check out"
          done
