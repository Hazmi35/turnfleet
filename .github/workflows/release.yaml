# SPDX-License-Identifier: AGPL-3.0-only
# Copyright (C) 2026 Turnfleet Authors
#
# Release: sign the two images at the digest `image.yaml` published for a tag,
# publish the chart and sign it at its own digest, attach an SPDX SBOM and SLSA
# provenance to each of the three artifacts, and write the release with the
# versions, the digests and the commands that check them.
#
# Shape, and why:
#
# * The trigger is the published release, the same event `image.yaml` builds on,
#   and the workflow waits for that build to publish the digests
#   (`IMAGE_WAIT_SECONDS`) before it resolves one. Both workflows start on the
#   release at once, and a pipeline that signed whatever the tag happened to
#   point at before the build finished would sign nothing in particular.
# * Resolution is not "the tag exists". A tag is a mutable reference, and it can
#   already resolve to an image built from an earlier commit: the v0.1.2 tag
#   resolved to the pre-fix build until the Image run republished it, and a
#   preparation that stopped at "the tag resolved" would have signed and
#   documented that build. A digest is therefore accepted only once the image it
#   points at carries the release's commit in
#   `org.opencontainers.image.revision`; a tag that never carries that build
#   fails the run, naming the revision it did see. The digest is read back from
#   the registry at the release's tag, so the images, their signatures, their
#   attestations and the notes all describe the build of the released commit,
#   and the tag resolves to the digest that was signed.
# * `image.yaml` gates the release's version tags on the release event, so the
#   tag this workflow resolves has one writer and not also a manual run's.
# * Signing is keyless (`id-token: write`): the signature carries a short-lived
#   Fulcio certificate for this workflow, so the repository holds no key to
#   rotate. docs/adr/0016-release-signature-storage.md records why the pinned
#   cosign is the v2 line and not v3.
# * The attestations are cosign attestations, because that is what
#   `cosign verify-attestation --type slsaprovenance` reads. `image.yaml` already
#   attaches buildkit's provenance inside the image index (`provenance: true`),
#   which that command does not look at, and ghcr.io does not serve the OCI 1.1
#   Referrers API that cosign v3 reaches for first.
# * The images are referenced as `tag@sha256:digest` everywhere, and the index
#   digest is what gets signed: it is the digest `image.yaml` publishes and the
#   one a consumer pulls by.
# * The chart is published from this workflow, not from a second one on the same
#   event: the keyless identity, `packages: write` and the registry login are
#   already here, and a second workflow would hold a second copy of all three
#   and sign under a different identity (ADR 17 records the trigger). The chart
#   job checks the chart's version and appVersion against the release tag before
#   it packages anything, so a release whose checklist bump was missed fails
#   instead of publishing a chart the release does not carry, and it signs the
#   digest its own push reported rather than the tag.
# * The notes and the evidence are written by the scripts in hack/release/, so
#   every step of this workflow can also be run by hand against a published
#   digest, and the notes take the digests and the identity as arguments instead
#   of repeating them.
name: Release

on:
  # The release is the trigger, not the tag: creating the GitHub release for a
  # version is the one act that publishes anything, and it runs this file with
  # the release's tag as the ref.
  release:
    types: [published]

# Read-only unless a job says otherwise: signing writes to the registry, and
# only the job that creates the release writes to the repository.
permissions:
  contents: read

# A release is never cancelled by another one: a half-signed digest is worse
# than a run that queues behind it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned here and held deliberately: cosign stays on the v2 line (ADR 16),
  # and syft is a download pin with a checksum, the way e2e.yaml pins the kind
  # binary. docs/versions.md records the cosign hold.
  COSIGN_VERSION: "v2.6.5"
  SYFT_VERSION: "v1.54.1"
  # sha256 of syft_1.54.1_linux_amd64.tar.gz from the syft release assets, the
  # way e2e.yaml pins the kind binary it downloads.
  SYFT_LINUX_AMD64_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
  # The OIDC issuer the Fulcio certificate is checked against, in the notes and
  # in this workflow's own verification steps.
  ISSUER: https://token.actions.githubusercontent.com
  # How long the Image workflow may take to publish the tag before this gives
  # up. An Image run on this repository takes about five minutes.
  IMAGE_WAIT_SECONDS: "1800"

jobs:
  # One place resolves the digests, so every job below signs, attests and
  # documents the same reference.
  prepare:
    name: Resolve the published digests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.digests.outputs.tag }}
      commit: ${{ steps.digests.outputs.commit }}
      identity: ${{ steps.digests.outputs.identity }}
      images: ${{ steps.digests.outputs.images }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Buildx is the registry client here: `imagetools inspect --raw` returns
      # the manifest bytes a tag resolves to, and their sha256 is the digest,
      # and `inspect --format '{{json .Image}}'` returns the image config the
      # revision label lives in.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the digests the tag published
        id: digests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source hack/release/lib.sh
          # The commit is read from the checkout rather than from GITHUB_SHA:
          # this workflow records the commit a release was built from, and a tag
          # push is the one event where that field is not worth trusting.
          commit="$(git rev-parse --verify 'HEAD^{commit}')"
          base="$(makefile_pin IMAGE_REGISTRY)"
          images="${RUNNER_TEMP}/images.tsv"
          deadline=$((SECONDS + IMAGE_WAIT_SECONDS))
          : >"$images"
          # image_revision prints the commit the image at REF was built from, as
          # the build stamped it. The revision is a label, so it lives in the
          # image config and not in the manifest: `.Image` is one config for a
          # single-platform image and a map of them keyed by platform for a
          # multi-arch one, which is why this searches for the first label
          # rather than indexing a platform's config directly. A digest carries
          # configs for both architectures and both are built from the same
          # commit, so the first is the image's revision. A registry that
          # answers nothing is reported as no revision rather than as a failure:
          # the caller then waits, the way it waits for a tag that is not
          # published yet, and the deadline is what ends the run.
          image_revision() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' 2>/dev/null \
              | jq -r '[.. | .config? // empty | .Labels? // empty | .["org.opencontainers.image.revision"]? // empty] | first // ""' \
              || true
          }
          for name in turnfleet-controller turnfleet-probe; do
            ref="${base}/${name}:${TAG}"
            digest=''
            while [ -z "$digest" ]; do
              raw="$(docker buildx imagetools inspect "$ref" --raw 2>/dev/null || true)"
              if printf '%s' "$raw" | jq -e 'has("mediaType")' >/dev/null 2>&1; then
                candidate="sha256:$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
                # The revision is read from the digest that was just resolved,
                # not from the tag again: the tag can be republished between the
                # two reads, and a revision read from the newer image would
                # justify the older digest.
                revision="$(image_revision "${base}/${name}@${candidate}")"
                # The tag can already resolve to an image built from another
                # commit: it is what an earlier release of this tag published,
                # and the Image run for the release being cut has not replaced
                # it yet. Signing that digest would document a build that is not
                # this release's, and the tag would not resolve to it once the
                # run lands, so it is not a digest at all until the image behind
                # it says it was built from this commit.
                if [ "$revision" = "$commit" ]; then
                  digest="$candidate"
                  break
                fi
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "::error::${ref} resolves to ${candidate}, built from ${revision:-an image with no org.opencontainers.image.revision label}, not from ${commit} after ${IMAGE_WAIT_SECONDS}s; check the Image workflow run for ${TAG}" >&2
                  exit 1
                fi
                echo "${ref} resolves to ${candidate}, built from ${revision:-an image with no org.opencontainers.image.revision label}, not from ${commit}; waiting for the Image run for ${TAG} to republish it"
              else
                # Only a manifest response resolves: an empty answer means the
                # Image workflow has not pushed this tag yet, and hashing that
                # would bless a digest of nothing.
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "::error::${ref} is still not published after ${IMAGE_WAIT_SECONDS}s; check the Image workflow run for ${TAG}" >&2
                  exit 1
                fi
                echo "${ref} is not published yet; waiting for the Image run for ${TAG} to push it"
              fi
              sleep 30
            done
            printf '%s\t%s\n' "$name" "${ref}@${digest}" >>"$images"
          done
          {
            echo "tag=${TAG}"
            echo "commit=${commit}"
            # The certificate identity keyless signing produces is the workflow
            # ref of this run; the notes have to record the value it used.
            echo "identity=https://github.com/${GITHUB_WORKFLOW_REF}"
            echo "images=$(jq -R -s -c 'split("\n") | map(select(length > 0) | split("\t") | {name: .[0], ref: .[1]})' "$images")"
          } >>"$GITHUB_OUTPUT"

  sign:
    name: Sign and attest ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Keyless signing: cosign trades this run's OIDC token for a Fulcio
      # certificate, which is what makes the signature checkable by identity.
      id-token: write
      # The signature and both attestations are pushed to ghcr.io.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.images) }}
    env:
      REF: ${{ matrix.ref }}
      NAME: ${{ matrix.name }}
      TAG: ${{ needs.prepare.outputs.tag }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      IDENTITY: ${{ needs.prepare.outputs.identity }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # The scanner that writes the SBOM is a pin like every other one: the
      # release tarball and its checksum, checked before it runs.
      - name: Install syft
        run: |
          set -euo pipefail
          curl -fsSLo syft.tar.gz "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          echo "${SYFT_LINUX_AMD64_SHA256}  syft.tar.gz" | sha256sum --check --strict -
          tar -xzf syft.tar.gz syft
          sudo install -m 0755 syft /usr/local/bin/syft
          rm -f syft syft.tar.gz
          syft version

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the published digest
        run: |
          set -euo pipefail
          cosign sign --yes \
            -a "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -a "org.opencontainers.image.revision=${COMMIT}" \
            -a "org.opencontainers.image.version=${TAG}" \
            "${REF}"

      - name: Generate the SBOM from the published digest
        run: hack/release/sbom.sh --image "${REF}" --output "${NAME}.spdx.json"

      - name: Attach the SBOM to the digest
        run: cosign attest --yes --type spdxjson --predicate "${NAME}.spdx.json" "${REF}"

      - name: Write the provenance predicate
        run: |
          set -euo pipefail
          hack/release/provenance.sh \
            --image "${REF}" \
            --tag "${TAG}" \
            --commit "${COMMIT}" \
            --repository-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --cosign-version "${COSIGN_VERSION}" \
            --syft-version "${SYFT_VERSION}" \
            --output "${NAME}.provenance.json"

      - name: Attach the provenance to the digest
        run: cosign attest --yes --type slsaprovenance --predicate "${NAME}.provenance.json" "${REF}"

      # The commands the release notes record are run once here, so a release
      # cannot document a check that does not pass, and the provenance is read
      # back to confirm it names the commit that was tagged.
      - name: Check the signature and both attestations
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "${REF}" >/dev/null
          cosign verify-attestation --type slsaprovenance \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "${REF}" \
            | jq -r .payload | base64 -d \
            | jq -e --arg commit "${COMMIT}" '.predicate.invocation.configSource.digest.sha1 == $commit' >/dev/null
          cosign verify-attestation --type spdxjson \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "${REF}" \
            | jq -r .payload | base64 -d \
            | jq -e '.predicate.spdxVersion == "SPDX-2.3"' >/dev/null
          echo "${REF}: signature, provenance and SBOM attestation verify"

  # The chart is the release's third artifact, beside the two images: one OCI
  # artifact per release, in its own namespace in the same registry, signed
  # keyless at the digest its own push reported. Nothing in here runs until a
  # release is cut (ADR 17), so the first release is where it is exercised; the
  # guard in the push step is what keeps a missed checklist bump from shipping.
  chart:
    name: Publish and sign the chart
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Keyless signing, as the sign job: the chart's signature carries the same
      # short-lived Fulcio certificate for this workflow.
      id-token: write
      # The chart, its signature and its two attestations are pushed to ghcr.io.
      packages: write
    outputs:
      # The published chart as one record: name, version, digest, the OCI
      # reference and the cosign reference, which the release job hands to the
      # notes.
      chart: ${{ steps.publish.outputs.chart }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      IDENTITY: ${{ needs.prepare.outputs.identity }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `make helm` asks the Go toolchain which helm release to download, so this
      # job needs `go` for that one question and nothing else. The version comes
      # from go.mod, the pin, rather than a second copy of GO_VERSION here.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The pinned helm with the checksum its release publishes next to it: the
      # Makefile holds the one copy of that pin (HELM_VERSION).
      - name: Get the pinned helm
        run: make helm

      # `helm push` reads the credentials `docker login` writes, so the one login
      # this job makes is the one the push and cosign both use: there is no
      # second `helm registry login` here.
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One step for the guard, the package and the push: chart.sh checks the
      # chart's version and appVersion against the release tag before it builds
      # the package, and it resolves the digest the push reported and proves the
      # registry serves it back.
      - name: Package, push and resolve the chart digest
        id: publish
        env:
          RECORD: ${{ runner.temp }}/chart.json
        run: |
          set -euo pipefail
          source hack/release/lib.sh
          hack/release/chart.sh \
            --tag "${TAG}" \
            --chart "$(makefile_pin HELM_CHART)" \
            --registry "$(makefile_pin IMAGE_REGISTRY)/turnfleet-chart" \
            --output "${RECORD}"
          record="$(jq -c . "${RECORD}")"
          echo "chart=${record}" >>"$GITHUB_OUTPUT"
          # The record's fields as environment variables rather than as an output
          # the steps below read with fromJSON: an output a failed step never
          # wrote is an expression error in the *next* step's env, and the run
          # then reports "The template is not valid ... Error reading JToken from
          # JsonReader" for every step that touches it, burying the error that
          # actually failed the job (v0.1.2's chart-version guard produced seven
          # of those for one real failure). A name in the environment is a plain
          # string, so the step after this one is simply skipped when this one
          # fails, and the run shows the real error.
          {
            echo "CHART_NAME=$(jq -r .name <<<"${record}")"
            echo "CHART_VERSION=$(jq -r .version <<<"${record}")"
            echo "CHART_REF=$(jq -r .ref <<<"${record}")"
            echo "CHART_OCI=$(jq -r .oci <<<"${record}")"
          } >>"$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the published chart digest
        run: |
          set -euo pipefail
          cosign sign --yes \
            -a "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -a "org.opencontainers.image.revision=${COMMIT}" \
            -a "org.opencontainers.image.version=${TAG}" \
            "${CHART_REF}"

      - name: Write the chart's provenance predicate
        run: |
          set -euo pipefail
          hack/release/chart-provenance.sh \
            --chart "${CHART_OCI}" \
            --chart-version "${CHART_VERSION}" \
            --tag "${TAG}" \
            --commit "${COMMIT}" \
            --repository-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --cosign-version "${COSIGN_VERSION}" \
            --output chart.provenance.json

      - name: Attach the provenance to the chart digest
        run: cosign attest --yes --type slsaprovenance --predicate chart.provenance.json "${CHART_REF}"

      # The chart's SBOM is pulled back by digest, so the document describes the
      # bytes the signature covers and not the checkout they were packaged from.
      - name: Write the chart's SBOM from the published digest
        run: hack/release/chart-sbom.sh --chart "${CHART_OCI}" --output chart.spdx.json

      - name: Attach the SBOM to the chart digest
        run: cosign attest --yes --type spdxjson --predicate chart.spdx.json "${CHART_REF}"

      # The three checks the notes record, run once here: the chart's signature,
      # the provenance naming the tagged commit and the released version, and the
      # SPDX document naming the chart it describes.
      - name: Check the chart's signature and both attestations
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "${CHART_REF}" >/dev/null
          cosign verify-attestation --type slsaprovenance \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "${CHART_REF}" \
            | jq -r .payload | base64 -d \
            | jq -e --arg commit "${COMMIT}" --arg version "${CHART_VERSION}" \
                '.predicate.invocation.configSource.digest.sha1 == $commit
                 and .predicate.invocation.parameters.chartVersion == $version' >/dev/null
          cosign verify-attestation --type spdxjson \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "${CHART_REF}" \
            | jq -r .payload | base64 -d \
            | jq -e --arg name "${CHART_NAME}" --arg version "${CHART_VERSION}" \
                '[.predicate.packages[] | select(.name == $name and .versionInfo == $version)] | length == 1' >/dev/null
          echo "${CHART_REF}: signature, provenance and SBOM attestation verify (chart ${CHART_VERSION})"

  release:
    name: Write the release
    needs:
      - prepare
      - sign
      - chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Only this job writes to the repository: the release and its assets.
      contents: write
      # The SBOMs are fetched from the attestations on the published digests.
      packages: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      IDENTITY: ${{ needs.prepare.outputs.identity }}
      IMAGES: ${{ needs.prepare.outputs.images }}
      CHART: ${{ needs.chart.outputs.chart }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The SBOM the release carries is the one the image carries: fetched from
      # the attestation at the digest, not re-uploaded from the sign job.
      - name: Fetch the attested SBOMs by digest
        run: |
          set -euo pipefail
          mkdir -p sboms
          while read -r name ref; do
            cosign verify-attestation --type spdxjson \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer "${ISSUER}" \
              "${ref}" \
              | jq -r .payload | base64 -d | jq .predicate >"sboms/${name}.spdx.json"
          done < <(jq -r '.[] | "\(.name) \(.ref)"' <<<"${IMAGES}")
          ls -l sboms

      - name: Write the release notes
        run: |
          set -euo pipefail
          args=()
          while read -r ref; do args+=(--image "${ref}"); done < <(jq -r '.[].ref' <<<"${IMAGES}")
          hack/release/notes.sh \
            --tag "${TAG}" \
            --commit "${COMMIT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --identity "${IDENTITY}" \
            --issuer "${ISSUER}" \
            --chart "$(jq -r .oci <<<"${CHART}")" \
            --chart-version "$(jq -r .version <<<"${CHART}")" \
            --output RELEASE_NOTES.md \
            "${args[@]}"

      - name: Publish the release with the digests and the SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "Turnfleet ${TAG}" --notes-file RELEASE_NOTES.md
          else
            gh release create "${TAG}" --verify-tag --title "Turnfleet ${TAG}" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "${TAG}" sboms/*.spdx.json --clobber
