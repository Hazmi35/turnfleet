# Overlay that adds the admission webhooks and their certificates.
#
# Use it when the cluster has cert-manager:
#   make deploy KUSTOMIZE_OVERLAY=config/with-webhook
#
# Everything else (CRDs, RBAC, the manager, metrics) comes from ../default.
#
# The namespace is repeated here because kustomize's transformers only reach the
# resources of the kustomization that declares them: ../default applies
# `namespace: turnfleet-system` and `namePrefix: turnfleet-` to its own
# resources, so the webhook Service, the cert-manager Issuer/Certificates and
# the two webhook configurations — added here, not inside ../default — are
# outside that scope. Without this line they land in a namespace called
# `system`, their references follow, and the manager (in turnfleet-system)
# mounts a serving-certificate Secret that cert-manager created in the wrong
# namespace. Only the namespace is repeated: repeating `namePrefix` here would
# prefix ../default's resources a second time
# (`turnfleet-turnfleet-controller-manager`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: turnfleet-system

resources:
- ../default
- ../webhook
- ../certmanager

patches:
- path: manager_webhook_patch.yaml
  target:
    kind: Deployment
# Turn admission back on: this overlay is the one that installs the serving
# certificates the webhook server reads.
- target:
    kind: Deployment
    name: turnfleet-controller-manager
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: turnfleet-controller-manager
    spec:
      template:
        spec:
          containers:
          - name: manager
            env:
            - name: ENABLE_WEBHOOKS
              value: "true"

replacements:
# The metrics Certificate is part of this overlay (../certmanager), so its
# dnsNames are filled in here. The source is the metrics Service as ../default
# names it: the prefix is applied inside ../default, so the name to match is the
# rendered one. The matching upstream targets for a Prometheus ServiceMonitor
# are left out because this overlay installs no ServiceMonitor (../prometheus is
# not in its resources).
 - source:
     kind: Service
     version: v1
     name: turnfleet-controller-manager-metrics-service
     fieldPath: metadata.name
   targets:
     - select:
         kind: Certificate
         group: cert-manager.io
         version: v1
         name: metrics-certs
       fieldPaths:
         - spec.dnsNames.0
         - spec.dnsNames.1
       options:
         delimiter: '.'
         index: 0
         create: true

 - source:
     kind: Service
     version: v1
     name: turnfleet-controller-manager-metrics-service
     fieldPath: metadata.namespace
   targets:
     - select:
         kind: Certificate
         group: cert-manager.io
         version: v1
         name: metrics-certs
       fieldPaths:
         - spec.dnsNames.0
         - spec.dnsNames.1
       options:
         delimiter: '.'
         index: 1
         create: true

 - source: # Uncomment the following block if you have any webhook
     kind: Service
     version: v1
     name: webhook-service
     fieldPath: .metadata.name # Name of the service
   targets:
     - select:
         kind: Certificate
         group: cert-manager.io
         version: v1
         name: serving-cert
       fieldPaths:
         - .spec.dnsNames.0
         - .spec.dnsNames.1
       options:
         delimiter: '.'
         index: 0
         create: true
 - source:
     kind: Service
     version: v1
     name: webhook-service
     fieldPath: .metadata.namespace # Namespace of the service
   targets:
     - select:
         kind: Certificate
         group: cert-manager.io
         version: v1
         name: serving-cert
       fieldPaths:
         - .spec.dnsNames.0
         - .spec.dnsNames.1
       options:
         delimiter: '.'
         index: 1
         create: true

 - source: # Uncomment the following block if you have a ValidatingWebhook (--programmatic-validation)
     kind: Certificate
     group: cert-manager.io
     version: v1
     name: serving-cert # This name should match the one in certificate.yaml
     fieldPath: .metadata.namespace # Namespace of the certificate CR
   targets:
     - select:
         kind: ValidatingWebhookConfiguration
       fieldPaths:
         - .metadata.annotations.[cert-manager.io/inject-ca-from]
       options:
         delimiter: '/'
         index: 0
         create: true
 - source:
     kind: Certificate
     group: cert-manager.io
     version: v1
     name: serving-cert
     fieldPath: .metadata.name
   targets:
     - select:
         kind: ValidatingWebhookConfiguration
       fieldPaths:
         - .metadata.annotations.[cert-manager.io/inject-ca-from]
       options:
         delimiter: '/'
         index: 1
         create: true

 - source: # Uncomment the following block if you have a DefaultingWebhook (--defaulting )
     kind: Certificate
     group: cert-manager.io
     version: v1
     name: serving-cert
     fieldPath: .metadata.namespace # Namespace of the certificate CR
   targets:
     - select:
         kind: MutatingWebhookConfiguration
       fieldPaths:
         - .metadata.annotations.[cert-manager.io/inject-ca-from]
       options:
         delimiter: '/'
         index: 0
         create: true
 - source:
     kind: Certificate
     group: cert-manager.io
     version: v1
     name: serving-cert
     fieldPath: .metadata.name
   targets:
     - select:
         kind: MutatingWebhookConfiguration
       fieldPaths:
         - .metadata.annotations.[cert-manager.io/inject-ca-from]
       options:
         delimiter: '/'
         index: 1
         create: true

