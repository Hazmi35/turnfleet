---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-turnfleet-hzmi-dev-v1alpha1-turnpool
  failurePolicy: Fail
  name: mturnpool-v1alpha1.kb.io
  rules:
  - apiGroups:
    - turnfleet.hzmi.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - turnpools
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-turnfleet-hzmi-dev-v1alpha1-turnpool
  failurePolicy: Fail
  name: vturnpool-v1alpha1.kb.io
  rules:
  - apiGroups:
    - turnfleet.hzmi.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - turnpools
  sideEffects: None
