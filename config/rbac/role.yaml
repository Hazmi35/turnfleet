---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - turnfleet.hzmi.dev
  resources:
  - turnpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - turnfleet.hzmi.dev
  resources:
  - turnpools/finalizers
  verbs:
  - update
- apiGroups:
  - turnfleet.hzmi.dev
  resources:
  - turnpools/status
  verbs:
  - get
  - patch
  - update
