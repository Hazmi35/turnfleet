---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: turnpools.turnfleet.hzmi.dev
spec:
  group: turnfleet.hzmi.dev
  names:
    categories:
    - turnfleet
    kind: TURNPool
    listKind: TURNPoolList
    plural: turnpools
    shortNames:
    - tpool
    singular: turnpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.addressing.mode
