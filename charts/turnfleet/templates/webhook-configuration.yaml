#
# The two webhook configurations, the same rules and the same service paths
# controller-gen writes into config/webhook/manifests.yaml. They point at the
# webhook Service above and are labelled with the serving Certificate by
# cert-manager's ca-injection annotation.
#
# failurePolicy is Fail: a TURNPool that the webhook cannot validate is not
# admitted, and an unreachable webhook does not silently admit one either.
{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/serving-cert
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: webhook-service
        namespace: {{ .Release.Namespace }}
        path: /mutate-turnfleet-hzmi-dev-v1alpha1-turnpool
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    name: mturnpool-v1alpha1.kb.io
    rules:
      - apiGroups:
          - turnfleet.hzmi.dev
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - turnpools
    sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/serving-cert
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-turnfleet-hzmi-dev-v1alpha1-turnpool
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    name: vturnpool-v1alpha1.kb.io
    rules:
      - apiGroups:
          - turnfleet.hzmi.dev
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - turnpools
    sideEffects: None
{{- end }}
