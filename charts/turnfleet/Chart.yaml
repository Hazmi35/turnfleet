# The Turnfleet controller as a chart.
#
# The manifests here mirror config/default (webhooks off) and
# config/with-webhook (webhooks on), which stay the source of truth for what the
# controller is: `make helm-drift` renders both and fails when they part ways.
# The chart is for installing the controller, never the relays — relay pods are
# created by the controller from a TURNPool, and nothing in the relay data path
# goes through this chart.
apiVersion: v2
name: turnfleet
description: The Turnfleet controller for TURN relay fleets.
type: application
version: 0.1.0
# The chart's version tracks the application version: both fields are the release
# version, so a chart release and an image release carry the same number. A
# released image has `0.1.0` beside the tag's `v0.1.0`, which is what this
# resolves to; before the first release, the Makefile's `IMAGE_TAG` (`dev`) is
# what a local build produces, and `make helm-install` passes it.
appVersion: "0.1.0"
home: https://github.com/Hazmi35/turnfleet
sources:
  - https://github.com/Hazmi35/turnfleet
