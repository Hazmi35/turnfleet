# A minimal NetworkAttachmentDefinition CRD for the envtest suite.
#
# The webhook reads a PodIP pool's attachment (k8s.cni.cncf.io/v1) to check that
# it exists, and envtest installs only the CRDs under config/crd/bases, so the
# kind has to come from somewhere. It is deliberately not part of config/: the
# operator does not own this CRD, Multus does, and the cluster installs it when
# Multus is installed (docs/adr/0018-addressing-mode-podip.md).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: network-attachment-definitions.k8s.cni.cncf.io
spec:
  group: k8s.cni.cncf.io
  scope: Namespaced
  names:
    kind: NetworkAttachmentDefinition
    listKind: NetworkAttachmentDefinitionList
    plural: network-attachment-definitions
    singular: network-attachment-definition
    shortNames:
      - net-attach-def
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                config:
                  type: string
